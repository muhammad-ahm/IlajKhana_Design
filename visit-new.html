<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add visit | IlajKhana</title><link rel="stylesheet" href="css/styles.css"></head><body data-layout="app" data-active="visits">
<h1 class="title">Add a visit</h1>

<label class="field"><span>Doctor name</span><input type="text"></label>
